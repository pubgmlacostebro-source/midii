<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мидии</title>
<meta name="theme-color" content="#0d0e11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Мидии">
<link rel="apple-touch-icon" id="ati" href="icon-dark.png">
<link rel="icon" type="image/png" href="icon-dark.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#0d0e11;--card:#17191e;--card2:#1f2229;--line:#2b2f38;--text:#f0efec;--text2:#c3c2b7;--mute:#898781;
  --accent:#f5a524;--accent-ink:#1a1204;--good:#0ca30c;--bad:#e66767;--rev:#3b4252;--profit:#199e70;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column}
#view{flex:1;min-height:0;width:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:20px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,textarea{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:16px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:44px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.num{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}.good{color:#35c46a}.bad{color:var(--bad)}

#top{flex:none;background:var(--bg);border-bottom:1px solid var(--line)}
#top .wrap{display:flex;align-items:center;justify-content:space-between;height:50px}
#top h1{font-size:18px;margin:0;letter-spacing:-.01em}
#top h1 b{color:var(--accent)}
#status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.gear{width:36px;height:36px;display:grid;place-items:center;color:var(--mute);border-radius:10px;margin-right:-8px}
.gear.on{color:var(--accent)}
.gear svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.700;stroke-linecap:round;stroke-linejoin:round}
.kpis.k2{grid-template-columns:1fr 1fr}
.top .btn{flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
.dot.ok{background:#35c46a}.dot.bad{background:var(--bad)}.dot.wait{background:var(--accent)}

#tabs{flex:none;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs .wrap{display:flex;padding:0 4px}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:10.5px;color:var(--mute)}
#tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--accent)}

h2{font-size:20px;margin:16px 0 10px;letter-spacing:-.01em}
h3{font-size:12px;margin:18px 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:600;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-style:dashed;color:var(--text2)}
.btn.danger{color:var(--bad);background:none;border-color:transparent}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:34px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mute);padding:0 8px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.empty{text-align:center;color:var(--mute);padding:26px 10px;font-size:14px}

/* календарь */
.weeknav{display:flex;align-items:center;gap:8px;margin:12px 0 8px}
.weeknav .t{flex:1;font-weight:700;font-size:16px}
.ico{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:18px;line-height:1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.week button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.week .w{font-size:11px;color:var(--mute);text-transform:uppercase}
.week .n{font-size:17px;font-weight:700}
.week .m{width:5px;height:5px;border-radius:50%;background:transparent}
.week .has .m{background:var(--accent)}
.week .today .n{color:var(--accent)}
.week .on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.week .on .w,.week .on .n{color:var(--accent-ink)}.week .on.has .m{background:var(--accent-ink)}
.daytitle{font-size:20px;font-weight:700;margin:16px 0 4px;letter-spacing:-.01em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 11px 0 0;border-radius:9px;background:var(--card2);border:1px solid var(--line);font-size:14px;font-weight:600;overflow:hidden}
.chip i{width:5px;align-self:stretch;flex:none}
.chip small{font-weight:500;color:var(--mute);font-size:12px}
.chip.sug{background:none;border-style:dashed;color:var(--text2)}
.chip.plain{padding:0 11px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.place .hd{display:flex;align-items:center;gap:9px;width:100%;text-align:left}
.place .hd b{font-size:17px}
.place .sum{font-size:12.5px;color:var(--mute);text-align:right}
.pdot{width:11px;height:11px;border-radius:4px;flex:none}
.grp{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.grp .gt{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);margin-bottom:8px;font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--line);color:var(--text2);text-transform:uppercase;letter-spacing:.03em}
.plus{min-height:34px;padding:0 11px;border-radius:9px;border:1px dashed var(--line);color:var(--mute);font-size:14px;font-weight:600}
.acts{display:flex;gap:8px;margin-top:12px}
.acts .btn{flex:1}

/* работники */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:0 12px 12px;overflow:hidden;display:flex;flex-direction:column}
.wcard .ln{height:5px;margin:0 -12px 10px}
.wcard .nm{font-size:17px;font-weight:700;margin-bottom:6px}
.wcard dl{margin:0;font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:3px 8px;flex:1;align-content:start}
.wcard dt{color:var(--mute)}.wcard dd{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wcard .btn{margin-top:10px}

/* объекты */
.ocard .ttl{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin-bottom:10px}

.tag.ok{background:#12351f;color:#35c46a}
.pdot{border:0}
.ocard .ttl b{font-size:17px;flex:1;min-width:90px}
.kv{display:grid;grid-template-columns:86px 1fr;gap:8px 10px;align-items:center;font-size:14px}
.kv>span:nth-child(odd){color:var(--mute)}
.inl{display:flex;align-items:center;gap:6px}
.inl input{width:120px;text-align:right}
.total{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:14px}
.total b{font-size:17px}

/* шторка */
#bg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
#bg.show{display:flex}
#sheet{background:var(--card);width:100%;max-width:560px;max-height:90%;overflow:auto;overscroll-behavior:contain;border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:0;padding:8px 16px calc(18px + env(safe-area-inset-bottom))}
@keyframes up{from{transform:translateY(40px)}}
#sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
#sheet .sh{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
#sheet .sh div{flex:1;min-width:0}
#sheet .sh b{font-size:19px;display:block}
#sheet .sh small{color:var(--mute);font-size:13px}
.fld{margin:12px 0}
.fld>label,.lbl{display:block;font-size:12px;color:var(--mute);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.crow{display:flex;align-items:center;gap:8px;padding:7px 0}
.crow .bar{width:5px;height:30px;border-radius:3px;flex:none}
.crow .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--mute);flex:none}
.mini input{width:58px;padding:7px 6px;text-align:right}
.mini.wide input{width:78px}
.payv{width:78px;text-align:right;font-size:14px;flex:none}
.x{width:30px;height:30px;border-radius:8px;color:var(--mute);font-size:15px;flex:none}
.box{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
.box div{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.box .big{font-size:17px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:9px}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 0;border-bottom:1px solid var(--line)}
.pick .bar{width:5px;height:34px;border-radius:3px;flex:none}
.pick .sp b{display:block}.pick .sp small{color:var(--mute);font-size:12.5px}
.pick .ck{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;color:var(--accent-ink)}
.pick.on .ck{background:var(--accent);border-color:var(--accent)}
.pick[disabled]{opacity:.45}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:var(--text)}
.rng{display:flex;align-items:center;gap:10px}
.rng input{padding:0;border:0;background:none;accent-color:var(--accent);height:30px}
.rng output{width:26px;text-align:right;font-weight:700}

/* статистика */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kpi span{display:block;font-size:11.5px;color:var(--mute)}
.kpi b{font-size:16px;white-space:nowrap}
.chart{display:flex;align-items:flex-end;gap:2px;height:150px;border-bottom:1px solid var(--line);margin-top:10px}
.col{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;border-radius:6px 6px 0 0}
.col.on{background:rgba(255,255,255,.07)}
.col .b{width:100%;max-width:26px;display:flex;flex-direction:column-reverse;gap:2px;border-radius:4px 4px 0 0;overflow:hidden;min-height:0}
.col .rv{background:var(--rev);justify-content:flex-start}
.col .rv .in{background:var(--profit);width:100%;border-radius:0}
.col .s{width:100%;flex:none}
.xl{display:flex;gap:2px;margin-top:4px}
.xl span{flex:1;min-width:0;text-align:center;font-size:10px;color:var(--mute);overflow:visible;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--text2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}
.tip{min-height:38px;font-size:13px;color:var(--text2);margin-top:8px}
.tip b{color:var(--text)}
.top{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.top:last-child{border-bottom:0}
.top .bar{width:5px;height:30px;border-radius:3px;flex:none}
.top .sp b{display:block}.top .sp small{color:var(--mute);font-size:12.5px}

.lst{display:flex;align-items:center;gap:8px;padding:6px 0}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#000;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.tg{width:34px;height:34px;border-radius:10px;background:#229ED9;display:grid;place-items:center;flex:none;transition:transform .12s}
.tg:active{transform:scale(.9)}
.tgl{color:#4db2e8;text-decoration:none;font-weight:600}
.tg svg{width:18px;height:18px;fill:#fff}
.crow .tg{width:30px;height:30px;border-radius:8px}
.sch{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:10px 6px}
.sch>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.sch b{text-align:center;font-size:12px;text-transform:uppercase;color:var(--mute);padding-bottom:4px;border-bottom:1px solid var(--line);margin-bottom:2px}
.sch b small{display:block;font-weight:500;font-size:10px}
.sch button{background:var(--card2);border:1px solid var(--line);border-top:3px solid;border-radius:7px;padding:4px 2px 3px;font-size:10.5px;font-weight:600;min-width:0;line-height:1.25;text-align:center}
.sch button span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sch button i{display:block;font-style:normal;font-size:11px;line-height:1.1}
.car{width:15px;height:15px;fill:var(--mute);flex:none}
.sch button .car{display:block;margin:2px auto 0;width:14px;height:14px}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.200;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nmt{display:flex;align-items:center;gap:8px}
.nmt>span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.sw .swc{border:0;padding:0;display:grid;place-items:center;background:conic-gradient(#f87171,#facc15,#4ade80,#2dd4bf,#60a5fa,#c084fc,#f472b6,#f87171)}
.swc span{width:26px;height:26px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--text)}
.swc .ic{width:14px;height:14px;stroke-width:2.600}
.cprev{height:64px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px;border:1px solid var(--line);transition:background-color .1s}
.cgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-bottom:10px}
.cgrid button{aspect-ratio:1;border-radius:7px;border:2px solid transparent;transition:transform .12s}
.cgrid button:active{transform:scale(.85)}
.cgrid button.on{border-color:#fff;box-shadow:inset 0 0 0 1.500px rgba(0,0,0,.55)}
.cr{-webkit-appearance:none;appearance:none;display:block;width:100%;height:16px;border-radius:8px;padding:0;border:1px solid var(--line);margin:2px 0 12px}
.cr::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid rgba(0,0,0,.35);box-shadow:0 1px 4px rgba(0,0,0,.5)}
.cr::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid rgba(0,0,0,.35)}
.cr.hue{background:linear-gradient(to right,hsl(0 90% 55%),hsl(60 90% 55%),hsl(120 90% 48%),hsl(180 90% 48%),hsl(240 90% 62%),hsl(300 90% 58%),hsl(360 90% 55%))}
.adj.pos{color:#35c46a}.adj.neg{color:var(--bad)}
#sbar{flex:none;display:none;height:env(safe-area-inset-top);border-bottom:1px solid var(--line);background:var(--bg)}
.app #sbar{display:block}
.icons{display:flex;gap:10px;flex-wrap:wrap}
.icons button{width:56px;height:56px;border-radius:14px;overflow:hidden;border:3px solid transparent;padding:0;transition:transform .12s}
.icons button:active{transform:scale(.92)}
.icons button.on{border-color:var(--text)}
.icons img{width:100%;height:100%;display:block}
:root{color-scheme:dark}
:root[data-theme=light]{color-scheme:light;--bg:#f3f4f6;--card:#ffffff;--card2:#eceef2;--line:#d6dae2;--text:#15171c;--text2:#3d424d;--mute:#717783;--rev:#c5cbd6;--bad:#d03b3b}
[data-theme=light] .good,[data-theme=light] .adj.pos{color:#0c8a45}
[data-theme=light] .tag{background:#e3e6ec}
[data-theme=light] .tag.ok{background:#d9f3e3;color:#0c8a45}
[data-theme=light] .col.on{background:rgba(0,0,0,.06)}
[data-theme=light] #bg{background:rgba(20,22,28,.45)}
[data-theme=light] #top.sc{box-shadow:0 6px 18px rgba(0,0,0,.12)}
[data-theme=light] .tgl{color:#1583c4}
#toast{color:#fff}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;min-height:44px}
.two>div{min-width:0}
.icons button{font-weight:800;font-size:22px;display:grid;place-items:center}
.icprev{width:76px;height:76px;border-radius:18px;flex:none;border:1px solid var(--line)}
.icset{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.icc{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 12px 0 8px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:14px;font-weight:600}
.icc i{width:22px;height:22px;border-radius:50%;border:1px solid var(--line)}
.tmline{display:flex;align-items:center;gap:6px;margin:-3px 0 5px 13px;padding:2px 0;font-size:12.500px;color:var(--mute)}
.tmline .ic{width:13px;height:13px}
.seg{position:relative}
.seg button{position:relative;z-index:1}
.segpill{position:absolute;top:3px;bottom:3px;border-radius:9px;background:var(--accent);z-index:0;pointer-events:none}
.seg button.sliding{background:transparent}
/* анимации */
#view{overflow-x:hidden}
.btn,.chip,.plus,.ico,.seg button,.week button,#tabs button,.x,.pick,.sw button,.gear{transition:transform .12s ease,background-color .2s,border-color .2s,color .2s,opacity .2s}
.btn:active,.chip:active,.plus:active,.ico:active,.week button:active,.x:active,.sw button:active,.gear:active{transform:scale(.94)}
.pick:active,.place .hd:active{opacity:.6}
#tabs button:active{transform:scale(.9)}
.col .b{transform-origin:bottom}
@keyframes pop{from{transform:scale(.7)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes fromR{from{opacity:0;transform:translateX(28px)}}
@keyframes fromL{from{opacity:0;transform:translateX(-28px)}}
@keyframes fade{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(40%)}}
#view.enter>*,#view.enter .wgrid>*{animation:rise .34s cubic-bezier(.2,.8,.2,1) both}
#view.e-left>*{animation-name:fromR}
#view.e-right>*{animation-name:fromL}
#view.e-fade>*{animation-name:fade}
#view.enter>*:nth-child(2),#view.enter .wgrid>*:nth-child(2){animation-delay:.04s}
#view.enter>*:nth-child(3),#view.enter .wgrid>*:nth-child(3){animation-delay:.08s}
#view.enter>*:nth-child(4),#view.enter .wgrid>*:nth-child(4){animation-delay:.12s}
#view.enter>*:nth-child(5),#view.enter .wgrid>*:nth-child(5){animation-delay:.16s}
#view.enter>*:nth-child(n+6),#view.enter .wgrid>*:nth-child(n+6){animation-delay:.2s}
#view.enter .col .b{transform-origin:bottom;animation:grow .5s cubic-bezier(.2,.8,.2,1) both}

#bg.out{pointer-events:none}


#top{transition:box-shadow .2s;position:relative;z-index:2}
#top.sc{box-shadow:0 6px 18px rgba(0,0,0,.5)}
#view.e-bars>*,#view.e-soft>*{animation:none}
#view.e-soft>.card,#view.e-soft>.empty{animation:rise .3s cubic-bezier(.2,.8,.2,1) both}

</style>
</head>
<body>
<div id="sbar"></div>

  <button data-act="tab" data-tab="workers"><svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c.6-3.6 3.200-5.500 6.500-5.500s5.900 1.900 6.500 5.500M16 5.200a3.500 3.500 0 010 6.600M18.500 14.800c1.700.8 2.700 2.500 3 5.200"/></svg>Работники</button>

</div></nav>

<script>
// ---------- помощники ----------
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8);
const fmt=n=>(Math.round(n)||0).toLocaleString('ru-RU');
const rub=n=>fmt(n)+' ₽';
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isNaN(n)?null:n};
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const monday=s=>addDays(s,-((pd(s).getDay()+6)%7));
const dShort=s=>s.slice(8)+'.'+s.slice(5,7);
const WD=['вс','пн','вт','ср','чт','пт','сб'];
const WDL=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const WORDER=[1,2,3,4,5,6,0];
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONS=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const dLong=s=>{const d=pd(s);return d.getDate()+' '+MON[d.getMonth()]};
// Цвета мест — фиксированный порядок, проверенная палитра для графиков
const PCOL=['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300','#9085e9','#e66767'];
// Цвета карточек работников
const WCOL=['#4ade80','#facc15','#f87171','#60a5fa','#c084fc','#fb923c','#2dd4bf','#f472b6'];
const CAR={no:'нет',lic:'права',car:'есть'};
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2600)}

// ---------- данные ----------
const defCfg=()=>({settings:{rw:500,rc:550,dh:9,me:'Я',mode:'h'},skills:['заезд','дренаж','септик','тёплый пол'],places:[],workers:[]});
let S={cfg:defCfg(),days:{},objs:{},pays:{}};
const today=iso(new Date());
const ui={wt:'c',ot:'a',pt:'w',tab:'cal',date:today,sheet:null,draft:null,st:{m:'month',a:today,c:'rev',i:-1}};
try{const t=localStorage.getItem('brigada-tab');if(t)ui.tab=t}catch(e){}

const ME={id:'me',color:'#f5a524',rating:10,skills:[],wd:[0,1,2,3,4,5,6]};
const active=()=>S.cfg.workers.filter(w=>!w.archived);
const typesOf=ob=>ob.types||(ob.type?[ob.type]:[]);
const tags=ob=>(typesOf(ob).length?typesOf(ob):['объект']).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
const CAR_I='<svg class="car" viewBox="0 0 24 24" aria-label="есть авто"><path d="M5 11l1.500-4.500A2 2 0 018.400 5h7.200a2 2 0 011.900 1.500L19 11h.500a1.500 1.500 0 011.500 1.500V17a1 1 0 01-1 1h-1a1 1 0 01-1-1v-1H6v1a1 1 0 01-1 1H4a1 1 0 01-1-1v-4.500A1.500 1.500 0 014.500 11zm2.100 0h9.800l-1.100-3.500a.500.500 0 00-.500-.500H8.700a.500.500 0 00-.500.400zM6.500 15a1 1 0 100-2 1 1 0 000 2zm11 0a1 1 0 100-2 1 1 0 000 2z"/></svg>';
const IC_OK='<svg class="ic" viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg>';
const IC_UNDO='<svg class="ic" viewBox="0 0 24 24"><path d="M9 6L4 11l5 5M4 11h10a5 5 0 010 10h-3"/></svg>';
// Палитра: готовые цвета и кружок «+» — системный выбор любого цвета
const swatches=(list,cur,act,extra,ch)=>`<div class="sw">${(list.includes(cur)?list:list.concat(cur)).map(c=>`<button class="${cur===c?'on':''}" style="background:${c}" data-act="${act}" ${extra} data-v="${c}" aria-label="Цвет"></button>`).join('')}<button class="swc" data-act="pick" data-ch="${ch}" ${extra} data-v="${cur}" aria-label="Свой цвет"><span><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span></button></div>`;
const IC_CLOCK='<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
// Часы по времени: от начала до конца смены минус неоплачиваемый обед. Смена через полночь считается до следующего дня
const tmMin=v=>{const m=/^(\d{1,2}):(\d{2})$/.exec(v||'');return m?+m[1]*60+ +m[2]:null};
function tmHours(t1,t2,l){const a=tmMin(t1),b=tmMin(t2);if(a==null||b==null)return null;let d=b-a;if(d<0)d+=1440;return Math.max(0,Math.round((d-(+l||0))/60*100)/100)}
const fmtH=h=>String(Math.round(h*100)/100).replace('.',',');
const tmText=c=>c.t1&&c.t2?c.t1+' – '+c.t2+(c.l?' · обед '+c.l+' мин':''):'Посчитать часы по времени';
const tgName=v=>String(v||'').trim().replace(/^(https?:\/\/)?(t\.me\/|telegram\.me\/)/i,'').replace(/^@/,'').replace(/[^\w]/g,'');
// Из ника получается ссылка на t.me — телефон открывает по ней чат в приложении Telegram.
// Адрес собран из кусочков нарочно: Apps Script принимает два слеша подряд за комментарий и обрезает строку
const tgUrl=w=>'https:/'+'/t.me/'+tgName(w.tg);
const tgBtn=w=>w.tg?`<a class="tg" href="${tgUrl(w)}" target="_blank" rel="noopener" aria-label="Написать в Telegram: @${esc(w.tg)}"><svg viewBox="0 0 24 24"><path d="M21.5 3.6L2.6 10.9c-.8.3-.8 1.400.1 1.700l4.700 1.500 1.800 5.600c.2.700 1.100.9 1.600.4l2.600-2.500 4.600 3.400c.6.400 1.400.1 1.600-.6L22.800 4.800c.2-.9-.6-1.500-1.300-1.200zM9.600 14.300l8-6.400-6.300 7.300-.3 3.200z"/></svg></a>`:'';
const mePay=P=>{const c=P.crew.me;return !c||c.o?'—':rub((+c.h||0)*(+P.rc||0))};
const W=id=>id==='me'?Object.assign({},ME,{name:S.cfg.settings.me||'Я',color:S.cfg.settings.meColor||ME.color}):(S.cfg.workers.find(w=>w.id===id)||{id,name:'(удалён)',color:'#555',skills:[],wd:[]});
const PL=id=>S.cfg.places.find(p=>p.id===id)||{id,name:'(место удалено)',color:'#555'};

// Сколько работник получил за день на месте: по часам или вручную. Владелец сам себе не платит
// Премия или вычет работнику за день
const adjOf=c=>c&&c.bon?(c.neg?-1:1)*Math.abs(+c.bon||0):0;
function payOf(P,w){const c=P.crew[w];if(!c||w==='me')return 0;return(P.mode==='m'?(+c.pay||0):(+c.h||0)*(+P.rw||0))+adjOf(c)}
// Затраты для статистики: премии и вычеты входят, только если в дне включено «учитывать в статистике»
const costOf=(P,w)=>payOf(P,w)-(P.adjStat===false?adjOf(P.crew[w]):0);
// Почасовая выручка считается только по людям без объекта; люди на объекте — это затраты объекта
function placeCalc(P){
  let hw=0,hm=0,paid=0,paidObj=0,hours=0,n=0,out=0;
  for(const w in P.crew){const c=P.crew[w],h=+c.h||0,p=costOf(P,w);out+=payOf(P,w);hours+=h;n++;
    if(c.o)paidObj+=p;else if(w==='me')hm+=h;else{hw+=h;paid+=p}}
  const rc=+P.rc||0,rev=(hw+hm)*rc,margin=hw*rc-paid;
  return{out,rev,paid,paidObj,margin,me:hm*rc+margin,hours,n,free:Object.keys(P.crew).some(w=>!P.crew[w].o)};
}
// По каждому объекту: в какие дни он шёл и сколько ушло ребятам
function objIndex(){
  const o={};
  for(const d in S.days)for(const pid in S.days[d].p){const P=S.days[d].p[pid];
    (P.objs||[]).forEach(id=>{(o[id]=o[id]||{dates:[],cost:0,hours:0}).dates.push(d)});
    for(const w in P.crew){const c=P.crew[w];if(c.o&&o[c.o]){o[c.o].cost+=costOf(P,w);o[c.o].hours+=+c.h||0}}}
  for(const id in o)o[id].dates.sort();
  return o;
}
// Итоги дня. Полученное за объект делится поровну между днями работы на нём
function dayStats(d,OI){
  const r={rev:0,paid:0,byPlace:{},w:{}},day=S.days[d];if(!day)return r;
  for(const pid in day.p){const P=day.p[pid],k=placeCalc(P);let pr=k.rev-k.paid-k.paidObj;
    r.rev+=k.rev;r.paid+=k.paid+k.paidObj;
    (P.objs||[]).forEach(id=>{const ob=S.objs[id];if(!ob||!OI[id])return;const sh=(+ob.received||0)/OI[id].dates.length;r.rev+=sh;pr+=sh});
    r.byPlace[pid]=pr;
    for(const w in P.crew)r.w[w]={h:+P.crew[w].h||0,pay:payOf(P,w)};}
  return r;
}
const busy=d=>{const b={},day=S.days[d];if(day)for(const pid in day.p)for(const w in day.p[pid].crew)b[w]={pid,o:day.p[pid].crew[w].o||''};return b};
function ensurePlace(d,pid){
  const day=S.days[d]=S.days[d]||{p:{}},s=S.cfg.settings;
  return day.p[pid]=day.p[pid]||{rw:s.rw,rc:s.rc,mode:s.mode||'h',note:'',objs:[],crew:{}};
}
function put(w,pid,o){
  const d=ui.date,day=S.days[d];let h=S.cfg.settings.dh;
  if(day)for(const p in day.p)if(day.p[p].crew[w]){h=day.p[p].crew[w].h;delete day.p[p].crew[w]}
  const c={h};if(o)c.o=o;ensurePlace(d,pid).crew[w]=c;save('days/'+d);
}

// ---------- хранение и синхронизация ----------
// Три режима: внутри Google Apps Script, на отдельном хостинге (данные через API по коду доступа) и просто файл на компьютере
const GAS=!!(window.google&&google.script&&google.script.run);
const API='https:/'+'/script.google.com/macros/s/AKfycbw5AA6WzvfabOj9Qn1-BezBSqVqL5hwQHZ-JRg7Q8t3o4dSX6o-UupqdIXmiDvksIlOKg/exec';
// Код доступа приходит в ссылке (#k=...) и запоминается на устройстве
const KEY=(()=>{let k='';try{k=new URLSearchParams(location.hash.slice(1)).get('k')||new URLSearchParams(location.search).get('k')||''}catch(e){}
  try{if(k)localStorage.setItem('midii-key',k);else k=localStorage.getItem('midii-key')||''}catch(e){}return k})();
const REMOTE=GAS||!!(API&&KEY),LOCKED=!GAS&&!!API&&!KEY;
const gas=(fn,...a)=>GAS?new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...a))
  :fetch(API,{method:'POST',body:JSON.stringify({key:KEY,fn,args:a})}).then(r=>r.json()).then(j=>{if(j.error)throw new Error(j.error);return j.result});
if(navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches))document.documentElement.classList.add('app');
// Иконка для экрана «Домой»: телефон берёт ту, что выбрана в момент добавления
// Тема оформления хранится на устройстве
let themeMem=null;
const THEME=()=>{if(themeMem)return themeMem;try{return localStorage.getItem('midii-theme')||'dark'}catch(e){return'dark'}};
function applyTheme(){const t=THEME();document.documentElement.dataset.theme=t;const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='light'?'#f3f4f6':'#0d0e11'}
applyTheme();
// Иконка для экрана «Домой» рисуется прямо в браузере по настройкам: два цвета фона, знак, его цвет, подчёркивание
const IC_PRESETS=[['#1b1e25','#0d0e11','#f5a524'],['#ffbe4d','#f08a00','#1a1204'],['#4f9cf5','#2563c9','#ffffff'],['#34c98e','#0f8a5f','#ffffff'],['#a595f5','#6a4fd6','#ffffff'],['#ffffff','#e6e4de','#17191e']];
const icDef=()=>({c1:IC_PRESETS[0][0],c2:IC_PRESETS[0][1],fg:IC_PRESETS[0][2],t:'М',line:true,custom:false});
let IC=icDef();try{const st=JSON.parse(localStorage.getItem('midii-iconcfg'));if(st&&st.c1)IC=Object.assign(icDef(),st)}catch(e){}
function drawIcon(c,size){
  const cv=document.createElement('canvas');cv.width=cv.height=size;const g=cv.getContext('2d'),gr=g.createLinearGradient(0,0,size,size);
  gr.addColorStop(0,c.c1);gr.addColorStop(1,c.c2);g.fillStyle=gr;g.fillRect(0,0,size,size);
  const t=[...(c.t||'')].slice(0,2).join('');g.fillStyle=c.fg;g.textAlign='center';g.textBaseline='middle';
  g.font='bold '+Math.round(size*([...t].length>1?.4:.52))+'px -apple-system,"Segoe UI",Roboto,Arial,sans-serif';
  g.fillText(t,size/2,size*(c.line?.46:.53));
  if(c.line)g.fillRect(size*.3,size*.76,size*.4,size*.045);
  return cv.toDataURL('image/png');
}
const applyIcon=()=>{const l=document.getElementById('ati');if(!l||GAS)return;try{l.href=IC.custom?drawIcon(IC,180):'icon-dark.png'}catch(e){}};
const saveIcon=()=>{IC.custom=true;try{localStorage.setItem('midii-iconcfg',JSON.stringify(IC))}catch(e){}applyIcon()};
applyIcon();
// Если в уже открытой странице меняется код в адресе, перечитываем его
window.addEventListener('hashchange',()=>{if(!GAS&&location.hash.indexOf('k=')>=0)location.reload()});
const LOCAL='brigada-v1';
const dirty=new Set();let flushT=null,pending=0,seq=0,lastRows='';
function docOf(path){const i=path.indexOf('/'),k=path.slice(0,i),id=path.slice(i+1);return k==='config'?S.cfg:k==='days'?S.days[id]:k==='pay'?S.pays[id]:S.objs[id]}
function save(path){
  if(path.indexOf('days/')===0){const d=path.slice(5),day=S.days[d];if(day&&!Object.keys(day.p).length)delete S.days[d]}
  if(!REMOTE){try{localStorage.setItem(LOCAL,JSON.stringify(S))}catch(e){}return}
  dirty.add(path);clearTimeout(flushT);flushT=setTimeout(flush,600);setStatus('wait','Сохраняю…');
}
async function flush(){
  if(!dirty.size||pending)return;
  const list=[...dirty].map(p=>{const d=docOf(p);return[p,d?JSON.stringify(d):null]});
  dirty.clear();pending++;seq++;
  try{await gas('setDocs',JSON.stringify(list));if(!dirty.size)setStatus('ok','Синхронизировано')}
  catch(e){list.forEach(x=>dirty.add(x[0]));setStatus('bad','Нет связи');toast('Не сохранилось. Проверьте интернет');clearTimeout(flushT);flushT=setTimeout(flush,5000)}
  finally{pending--;if(dirty.size&&!flushT)flushT=setTimeout(flush,600)}
}
const typing=()=>{const a=document.activeElement;return a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)};
async function pull(first){
  if(!REMOTE||pending||dirty.size)return;
  const my=++seq;
  try{
    const raw=await gas('getAll');
    if(pending||dirty.size||my!==seq||(!first&&typing()))return;
    setStatus('ok','Синхронизировано');
    if(raw===lastRows)return;lastRows=raw;
    const n={cfg:defCfg(),days:{},objs:{},pays:{}};
    JSON.parse(raw).forEach(([p,j])=>{const v=JSON.parse(j);
      if(p.indexOf('pay/')===0)n.pays[p.slice(4)]=v;else if(p==='config/main')n.cfg=normCfg(v);else if(p.indexOf('days/')===0)n.days[p.slice(5)]=v;else if(p.indexOf('objects/')===0)n.objs[p.slice(8)]=v});
    S=n;render();
  }catch(e){setStatus('bad',e&&e.message==='forbidden'?'Неверный код доступа':'Нет связи')}
}
function normCfg(c){const d=defCfg();return{settings:Object.assign(d.settings,c.settings),skills:c.skills||d.skills,places:c.places||[],workers:c.workers||[]}}
function setStatus(cls,text){$('status').innerHTML=`<span class="dot ${cls}"></span><span>${text}</span>`}
function start(){
  if(LOCKED){setStatus('bad','Нет доступа');render();return}
  if(REMOTE){setStatus('wait','Загрузка…');render('up');pull(true);
    setInterval(()=>{if(!document.hidden)pull()},15000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
  }else{
    try{const s=JSON.parse(localStorage.getItem(LOCAL));if(s&&s.cfg)S={cfg:normCfg(s.cfg),days:s.days||{},objs:s.objs||{},pays:s.pays||{}}}catch(e){}
    setStatus('','Только на этом устройстве');render('up');
  }
}

// ---------- отрисовка ----------
const view=$('view');
const VIEWS={},SHEETS={},ACT={},IN={},LIVE={};
let rendered=false,animT=null,closeT=null,closeA=[];
const EASE='cubic-bezier(.2,.8,.2,1)';
const stopClose=()=>{clearTimeout(closeT);closeA.forEach(a=>a.cancel());closeA=[]};
// Все анимации запускаются из кода через element.animate: так они одинаково работают в Safari на iPhone, Chrome и остальных браузерах
function animateView(kind){
  if(!view.animate)return;
  const side=kind==='left'||kind==='right',from=kind==='left'?'translateX(12px)':kind==='right'?'translateX(-12px)':kind==='fade'?'none':'translateY(14px)';
  if(kind!=='bars'){
    let els=[];[...view.children].forEach(el=>{if(el.classList.contains('wgrid'))els.push(...el.children);else els.push(el)});
    if(kind==='soft')els=els.filter(el=>/\b(card|empty|wcard)\b/.test(el.className));
    els.forEach((el,i)=>el.animate([{opacity:0,transform:from},{opacity:1,transform:'none'}],{duration:side?300:340,delay:side?0:Math.min(i,6)*40,easing:side?'cubic-bezier(.4,0,.2,1)':EASE,fill:'backwards'}));
  }
  view.querySelectorAll('.col .b').forEach(el=>el.animate([{transform:'scaleY(0)'},{transform:'none'}],{duration:500,easing:EASE}));
}
const ACCENTS=['#f5a524','#ff7a45','#e66767','#d55181','#9085e9','#3987e5','#2dd4bf','#35c46a','#e8e6e1'];
// Акцентный цвет и подходящий к нему цвет текста на кнопках
function applyAccent(){
  const c=S.cfg.settings.accent||ACCENTS[0],n=parseInt(c.slice(1),16),l=(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255,r=document.documentElement.style;
  r.setProperty('--accent',c);r.setProperty('--accent-ink',l>.55?'#1a1204':'#fff');
}
// anim: 'up' | 'left' | 'right' | 'fade' — появление экрана; без него перерисовка мгновенная
function render(anim){
  rendered=true;applyAccent();
  if(LOCKED){view.innerHTML='<div class="empty">Нет кода доступа.<br>Откройте приложение по полной ссылке, которую вам прислали.</div>';return}
  view.className='wrap';clearTimeout(animT);
  document.querySelectorAll('#tabs button,.gear').forEach(b=>b.classList.toggle('on',b.dataset.tab===ui.tab));
  view.innerHTML=VIEWS[ui.tab]();
  if(anim)animateView(anim);
  if(ui.sheet)renderSheet();
}
function openSheet(name,args){
  const bg=$('bg'),sh=$('sheet');const closing=bg.classList.contains('out');stopClose();
  const fresh=!bg.classList.contains('show')||closing,was=ui.sheet&&ui.sheet.name;
  bg.classList.remove('out');ui.sheet={name,args:args||{}};renderSheet();sh.scrollTop=0;
  if(!ui.sheet||!sh.animate)return;
  const ease='cubic-bezier(.22,.8,.3,1)';
  if(fresh){sh.animate([{transform:'translateY(100%)'},{transform:'none'}],{duration:420,easing:ease});bg.animate([{opacity:0},{opacity:1}],{duration:300})}
  else if(was!==name)sh.animate([{transform:'translateY(45%)',opacity:.3},{transform:'none',opacity:1}],{duration:340,easing:ease});
}
function closeSheet(){
  ui.sheet=null;ui.draft=null;rendered=true;const bg=$('bg');
  const sh=$('sheet');stopClose();
  if(sh.animate&&bg.classList.contains('show'))closeA=[sh.animate([{transform:'none'},{transform:'translateY(45%)'}],{duration:220,easing:'ease-in',fill:'forwards'}),bg.animate([{opacity:1},{opacity:0}],{duration:220,fill:'forwards'})];
  bg.classList.add('out');closeT=setTimeout(()=>{bg.classList.remove('show','out');stopClose()},220);
  view.className='wrap';view.innerHTML=VIEWS[ui.tab]();
}
function renderSheet(){
  const el=$('sheet'),top=el.scrollTop,html=SHEETS[ui.sheet.name](ui.sheet.args);
  if(html==null){closeSheet();return}
  el.innerHTML='<div class="grab"></div>'+html;$('bg').classList.add('show');el.scrollTop=top;
}

  const d=ui.date,mon=monday(d),day=S.days[d],wd=pd(d).getDay(),b=busy(d);

  for(let i=0;i<7;i++){const x=addDays(mon,i),has=S.days[x]&&Object.values(S.days[x].p).some(P=>Object.keys(P.crew).length);
    h+=`<button class="${x===d?'on':''} ${x===today?'today':''} ${has?'has':''}" data-act="day" data-d="${x}"><span class="w">${WD[pd(x).getDay()]}</span><span class="n">${+x.slice(8)}</span><span class="m"></span></button>`}

  if(sug.length)h+=`<h3>Хотят выйти в этот день</h3><div class="chips">${sug.map(w=>chip(w.id,`data-w="${w.id}"`,'sug')).join('')}</div>`;

  if(!pids.length)h+=`<div class="empty">На этот день пока никого нет.<br>Добавьте место и поставьте людей.</div>`;

    (P.objs||[]).forEach(o=>{const ob=S.objs[o]||{name:'(объект удалён)'};
      h+=`<div class="grp"><div class="gt">${tags(ob)}${esc(ob.name)}</div><div class="chips">${ws.filter(w=>P.crew[w].o===o).map(w=>chip(w,`data-pid="${pid}"`)).join('')}<button class="plus" data-act="addCrew" data-pid="${pid}" data-o="${o}">+ люди</button></div></div>`});
    const free=ws.filter(w=>!P.crew[w].o);

// ----- Выплаты -----
// Долги считаются по всем дням до сегодня: начислено минус записанные платежи
function ledger(){
  const w={},p={},at=(m,k)=>m[k]=m[k]||{due:0,got:0};
  for(const d in S.days){if(d>today)continue;for(const pid in S.days[d].p){const P=S.days[d].p[pid],k=placeCalc(P);
    if(k.rev)at(p,pid).due+=k.rev;
    for(const x in P.crew){const v=payOf(P,x);if(v)at(w,x).due+=v}}}
  for(const id in S.pays){const y=S.pays[id];at(y.t==='w'?w:p,y.ref).got+=+y.sum||0}
  return{w,p};
}
// Почасовая работа на месте по дням: сколько начислено за день и сколько из этого уже оплачено.
// Оплата с пометкой «за день» идёт в этот день, оплата без пометки закрывает самые старые неоплаченные дни
function placeDays(pid){
  const ds=[];for(const d in S.days){if(d>today)continue;const P=S.days[d].p[pid];if(!P)continue;const r=placeCalc(P).rev;if(r)ds.push({d,due:r,got:0})}
  ds.sort((a,b)=>a.d<b.d?-1:1);let pool=0;
  for(const id in S.pays){const y=S.pays[id];if(y.t!=='p'||y.ref!==pid)continue;const x=y.for&&ds.find(k=>k.d===y.for);if(x)x.got+=+y.sum||0;else pool+=+y.sum||0}
  ds.forEach(x=>{if(x.got>x.due){pool+=x.got-x.due;x.got=x.due}});
  ds.forEach(x=>{const use=Math.min(x.due-x.got,pool);x.got+=use;pool-=use});
  return ds;
}
const dayRows=pid=>placeDays(pid).filter(x=>x.due-x.got>.5).map(x=>`<div class="top" style="padding-left:15px"><span class="sp"><b style="font-size:14px">${WD[pd(x.d).getDay()]}, ${dLong(x.d)}</b><small class="num">начислено ${fmt(x.due)}${x.got?' · получено '+fmt(x.got):''}</small></span><b class="num">${rub(x.due-x.got)}</b><button class="btn sm" data-act="pay" data-t="p" data-ref="${pid}" data-for="${x.d}">Получил</button></div>`).join('');
const objBal=ob=>{const r=(+ob.price||0)-(+ob.received||0);return ob.price==null?'<span class="mute">цена не указана</span>':r>0?`<b class="num">${rub(r)}</b>`:r<0?`<span class="num mute">переплата ${rub(-r)}</span>`:'<span class="good">оплачен</span>'};
const balHtml=(b,over)=>b>0?`<b class="num">${rub(b)}</b>`:b<0?`<span class="num ${over==='переплата'?'mute':'good'}">${over} ${over==='переплата'?'':'+'}${rub(-b)}</span>`:'<span class="good">расчёт</span>';
VIEWS.pays=()=>{
  const L=ledger(),t=ui.pt,sum=m=>Object.values(m).reduce((s,x)=>s+Math.max(0,x.due-x.got),0);
  const objs=Object.keys(S.objs),oDue=objs.reduce((s,id)=>s+Math.max(0,(+S.objs[id].price||0)-(+S.objs[id].received||0)),0);
  let h=`<h2>Выплаты</h2><div class="kpis k2"><div class="kpi"><span>Нужно выплатить ребятам</span><b class="num">${rub(sum(L.w))}</b></div><div class="kpi"><span>Нужно получить</span><b class="num">${rub(sum(L.p)+oDue)}</b></div></div>

      <div class="mute" style="font-size:12.5px">Считаются смены до сегодняшнего дня включительно.</div>`}
  else{const ids=Object.keys(L.p).sort((a,b)=>(L.p[b].due-L.p[b].got)-(L.p[a].due-L.p[a].got));
    h+=`<h3>Почасовая работа по местам</h3><div class="card">${ids.map(id=>row('p',id,PL(id),L.p[id],'начислено','получено','Всё сразу','доп. прибыль')+dayRows(id)).join('')||'<div class="mute">Почасовой работы пока нет.</div>'}</div>
      <h3>Объекты</h3><div class="card">${objs.map(id=>{const ob=S.objs[id];return`<div class="top"><button class="sp" style="text-align:left" data-act="objPay" data-id="${id}"><b>${esc(ob.name)}</b><small class="num">цена ${ob.price==null?'—':fmt(ob.price)} · получено ${fmt(ob.received)}</small></button><span style="text-align:right">${objBal(ob)}</span><button class="btn sm" data-act="objPay" data-id="${id}">Изменить</button></div>`}).join('')||'<div class="mute">Объектов пока нет.</div>'}</div>`}
  return h;
};

// ----- Статистика -----
function period(){
  const a=ui.st.a,m=ui.st.m,y=a.slice(0,4);
  if(m==='week'){const s=monday(a);return{n:7,title:dShort(s)+' – '+dShort(addDays(s,6)),idx:d=>{const k=Math.round((pd(d)-pd(s))/864e5);return k>=0&&k<7?k:-1},lab:i=>WD[WORDER[i]],name:i=>dLong(addDays(s,i))}}
  if(m==='month'){const ym=a.slice(0,7),n=new Date(+y,+a.slice(5,7),0).getDate();return{n,title:MONN[+a.slice(5,7)-1]+' '+y,idx:d=>d.slice(0,7)===ym?+d.slice(8)-1:-1,lab:i=>i===0||(i+1)%5===0?i+1:'',name:i=>dLong(ym+'-'+pad(i+1))}}
  return{n:12,title:y,idx:d=>d.slice(0,4)===y?+d.slice(5,7)-1:-1,lab:i=>MONS[i][0].toUpperCase(),name:i=>MONN[i]+' '+y};
}
VIEWS.stats=()=>{
  const P=period(),OI=objIndex(),B=Array.from({length:P.n},()=>({rev:0,paid:0,pl:{}})),wk={},used=new Set();let rev=0,paid=0;
  for(const d in S.days){const i=P.idx(d);if(i<0)continue;const r=dayStats(d,OI);
    B[i].rev+=r.rev;B[i].paid+=r.paid;rev+=r.rev;paid+=r.paid;
    for(const pid in r.byPlace)B[i].pl[pid]=(B[i].pl[pid]||0)+r.byPlace[pid];
    for(const w in r.w){const x=wk[w]=wk[w]||{n:0,h:0,pay:0};x.n++;x.h+=r.w[w].h;x.pay+=r.w[w].pay}
    for(const pid in S.days[d].p)(S.days[d].p[pid].objs||[]).forEach(o=>used.add(o))}
  const LP=ledger().p;
  for(const pid in LP){const sur=LP[pid].got-LP[pid].due;if(sur<=0)continue;
    const dt=Object.values(S.pays).filter(y=>y.t==='p'&&y.ref===pid).map(y=>y.date).sort().pop(),i=dt?P.idx(dt):-1;
    if(i>=0){B[i].rev+=sur;B[i].pl[pid]=(B[i].pl[pid]||0)+sur;rev+=sur}}
  const sel=ui.st.i<P.n?ui.st.i:-1,c=ui.st.c;
  let h=`<h2>Статистика</h2><div class="seg">${[['week','Неделя'],['month','Месяц'],['year','Год']].map(([k,t])=>`<button class="${ui.st.m===k?'on':''}" data-act="stMode" data-m="${k}">${t}</button>`).join('')}</div>
    <div class="weeknav"><button class="ico" data-act="stNav" data-n="-1" aria-label="Назад">‹</button><div class="t" style="text-align:center">${P.title}</div>${P.idx(today)<0?'<button class="btn sm" data-act="stToday">Сегодня</button>':''}<button class="ico" data-act="stNav" data-n="1" aria-label="Вперёд">›</button></div>
    <div class="kpis"><div class="kpi"><span>Выручка</span><b class="num">${fmt(rev)} ₽</b></div><div class="kpi"><span>Прибыль</span><b class="num">${fmt(rev-paid)} ₽</b></div><div class="kpi"><span>Ребятам</span><b class="num">${fmt(paid)} ₽</b></div></div>
    <div class="card"><div class="seg"><button class="${c==='rev'?'on':''}" data-act="stChart" data-c="rev">Выручка и прибыль</button><button class="${c==='pl'?'on':''}" data-act="stChart" data-c="pl">Прибыль по местам</button></div>`;
  const pls=S.cfg.places.filter(p=>B.some(b=>b.pl[p.id]));
  const tot=b=>c==='rev'?b.rev:pls.reduce((s,p)=>s+Math.max(0,b.pl[p.id]||0),0);
  const max=Math.max(1,...B.map(tot));
  h+=`<div class="chart" role="img" aria-label="${c==='rev'?'Выручка и прибыль':'Прибыль по местам'} за ${P.title}">`+B.map((b,i)=>{
    const t=tot(b);let inner='';
    if(c==='rev')inner=`<span class="b rv" style="height:${t/max*100}%"><span class="in" style="height:${t?Math.max(0,Math.min(1,(b.rev-b.paid)/t))*100:0}%"></span></span>`;
    else inner=`<span class="b" style="height:${t/max*100}%">${pls.map(p=>{const v=Math.max(0,b.pl[p.id]||0);return v?`<span class="s" style="background:${p.color};height:${v/t*100}%"></span>`:''}).join('')}</span>`;
    return`<button class="col ${i===sel?'on':''}" data-act="stBar" data-i="${i}" title="${P.name(i)}: ${rub(c==='rev'?b.rev:b.rev-b.paid)}" aria-label="${P.name(i)}">${inner}</button>`}).join('')+
    `</div><div class="xl">${B.map((b,i)=>`<span>${P.lab(i)}</span>`).join('')}</div>`;
  if(sel>=0){const b=B[sel];h+=`<div class="tip"><b>${P.name(sel)}</b><br>`+(c==='rev'?`выручка <b class="num">${rub(b.rev)}</b> · прибыль <b class="num">${rub(b.rev-b.paid)}</b>`:(pls.filter(p=>b.pl[p.id]).map(p=>`${esc(p.name)} <b class="num">${rub(b.pl[p.id])}</b>`).join(' · ')||'нет данных'))+'</div>'}
  else h+=`<div class="tip">${rev||paid?'Нажмите на столбик, чтобы увидеть цифры.':'За этот период данных нет.'}</div>`;
  h+=c==='rev'?`<div class="legend"><span><i style="background:var(--rev)"></i>Выручка</span><span><i style="background:var(--profit)"></i>Прибыль</span></div>`
    :`<div class="legend">${pls.map(p=>`<span><i style="background:${p.color}"></i>${esc(p.name)} · <b class="num" style="color:var(--text)">${rub(B.reduce((s,b)=>s+(b.pl[p.id]||0),0))}</b></span>`).join('')}</div>`;
  h+='</div>';
  const top=Object.keys(wk).sort((a,b)=>wk[b].n-wk[a].n||wk[b].h-wk[a].h);
  h+=`<h3>Кто сколько выходил</h3><div class="card">${top.map(w=>{const x=W(w);return`<div class="top"><span class="bar" style="background:${x.color}"></span><span class="sp"><b>${esc(x.name)}</b><small class="num">${wk[w].n} ${plural(wk[w].n,'смена','смены','смен')} · ${fmt(wk[w].h)} ч</small></span><span class="num">${w==='me'?'':rub(wk[w].pay)}</span></div>`}).join('')||'<div class="mute">Нет смен за период</div>'}</div>`;
  const ty={};used.forEach(o=>{const ob=S.objs[o];if(!ob)return;const key=typesOf(ob).join(' + ')||'без вида',t=ty[key]=ty[key]||{n:0,p:0};t.n++;t.p+=(+ob.received||0)-OI[o].cost});
  h+=`<h3>Прибыль по объектам</h3><div class="card">${Object.keys(ty).sort((a,b)=>ty[b].p-ty[a].p).map(t=>`<div class="top"><span class="tag">${esc(t)}</span><span class="sp"><small class="num">${ty[t].n} шт.</small></span><b class="num ${ty[t].p<0?'bad':''}">${ty[t].p>0?'+':''}${rub(ty[t].p)}</b></div>`).join('')||'<div class="mute">Нет объектов за период</div>'}</div>`;
  return h;
};
const plural=(n,a,b,c)=>{const k=n%100,j=n%10;return k>10&&k<20?c:j===1?a:j>1&&j<5?b:c};

ACT.meColor=({v})=>{S.cfg.settings.meColor=v;save('config/main')};
SHEETS.plColor=({id})=>head(PL(id).name,'Цвет места')+swatches(PCOL,PL(id).color,'plColorSet',`data-id="${id}"`,'place');
ACT.plColor=({id})=>openSheet('plColor',{id});
ACT.plColorSet=({id,v})=>{PL(id).color=v;save('config/main');closeSheet()};

// Выдуманные данные для знакомства с приложением
ACT.demo=()=>{
  const mk=(name,color,rating,interest,skills,wd,car)=>({id:uid(),name,color,rating,interest,skills,wd,car,note:''});
  const ws=[mk('Ваня',WCOL[2],9,10,['дренаж','септик','тёплый пол'],[3,5,0],'lic'),mk('Арсен',WCOL[0],6,7,['заезд','дренаж'],[3,0],'car'),mk('Антон',WCOL[1],3,2,['заезд'],[2,3,5],'no'),
    mk('Егор',WCOL[1],7,8,['септик'],[1,2,4],'car'),mk('Лёша',WCOL[3],5,6,['септик','заезд'],[2,4,6],'no'),mk('Никита',WCOL[4],4,5,[],[1,2],'no')];
  S.cfg.workers=ws;S.cfg.places=['Всеволожск','Акватория','Завод'].map((name,i)=>({id:uid(),name,color:PCOL[i]}));
  const[v,a,z]=S.cfg.places.map(p=>p.id),o1=uid(),o2=uid(),keep=ui.date;
  S.objs[o1]={name:'Септик у Петровых',types:['септик','дренаж'],place:a,price:60000,received:42000,note:''};S.objs[o2]={name:'Заезд на участок 14',types:['заезд'],place:v,price:24000,received:24000,note:''};
  [['w',ws[2].id,20000],['w',ws[0].id,18000],['p',v,60000]].forEach(([t,ref,sum])=>{const id=uid();S.pays[id]={t,ref,sum,date:addDays(today,-5),note:''};save('pay/'+id)});
  for(let i=-16;i<=1;i++){const d=addDays(today,i),wd=pd(d).getDay();if(wd===0)continue;ui.date=d;
    put(ws[i&1].id,v,'');put(ws[2].id,v,'');if(i%3===0)put('me',v,'');
    if(i>=-9&&i<=-7){ensurePlace(d,a).objs.push(o1);put(ws[3].id,a,o1);put(ws[4].id,a,o1)}
    if(i===-4||i===-3){S.days[d].p[v].objs.push(o2);put(ws[5].id,v,o2)}
    if(wd===2||wd===4)put(ws[4].id,z,'');
    save('days/'+d)}
  ui.date=keep;save('config/main');save('objects/'+o1);save('objects/'+o2);toast('Пример загружен');render();
};

// ---------- события ----------
// Переключатели: подсветка плавно переезжает на выбранную кнопку
function segMark(el){
  const seg=el.closest('.seg');if(!seg||el.classList.contains('on'))return null;const on=seg.querySelector('.on');if(!on)return null;
  const root=el.closest('#sheet')?$('sheet'):view;return{root,i:[...root.querySelectorAll('.seg')].indexOf(seg),oi:[...seg.children].indexOf(on)};
}
function segSlide(m){
  if(!m)return;const seg=m.root.querySelectorAll('.seg')[m.i],on=seg&&seg.querySelector('.on'),old=seg&&seg.children[m.oi];if(!on||!on.animate||!old||old===on)return;
  // Без движения: подсветка гаснет на прежней кнопке и проявляется на новой
  const cs=getComputedStyle(on),acc=cs.backgroundColor,ink=cs.color,mute=getComputedStyle(old).color,opt={duration:280,easing:'ease-in-out'};
  on.animate([{backgroundColor:'rgba(0,0,0,0)',color:mute},{backgroundColor:acc,color:ink}],opt);
  old.animate([{backgroundColor:acc,color:ink},{backgroundColor:'rgba(0,0,0,0)',color:mute}],opt);
}
function tap(t){
  if(t.id==='bg'){closeSheet();return true}
  const el=t.closest('[data-act]');if(!el||el.disabled)return false;
  const inSheet=!!el.closest('#sheet'),f=ACT[el.dataset.act];
  if(f){const sg=segMark(el);rendered=false;f(el.dataset,el);if(!inSheet&&!ui.sheet&&!rendered)render();segSlide(sg)}
  return !!f;
}
document.addEventListener('click',e=>{if(Date.now()-lastTap>600)tap(e.target)});
// ----- Свой цвет: окно с сеткой цветов и ползунками -----
function hsl2hex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,'0')};return'#'+f(0)+f(8)+f(4)}
function hex2hsl(x){const n=parseInt(String(x||'#888888').slice(1),16),r=(n>>16)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,l=(mx+mn)/2;
  let h=0;if(d)h=mx===r?((g-b)/d+6)%6:mx===g?(b-r)/d+2:(r-g)/d+4;
  return[Math.round(h*60),Math.round(d?d/(1-Math.abs(2*l-1))*100:0),Math.round(l*100)]}
const HUES=[0,18,35,50,75,130,165,190,212,245,280,325],SHADES=[[92,80],[90,68],[84,57],[80,46],[72,35]],GRAYS=[96,88,80,72,64,56,48,40,32,24,16,9];
const trackS=p=>`linear-gradient(to right,hsl(${p.h} 0% ${p.l}%),hsl(${p.h} 100% ${p.l}%))`;
const trackL=p=>`linear-gradient(to right,#000,hsl(${p.h} ${p.s}% 50%),#fff)`;
const pickHex=q=>q.hex||hsl2hex(q.h,q.s,q.l);
SHEETS.color=()=>{
  const p=ui.pick;if(!p)return null;const cur=pickHex(p);
  const cell=(h,s,l)=>`<button class="${hsl2hex(h,s,l)===cur?'on':''}" style="background:hsl(${h} ${s}% ${l}%)" data-act="pickSet" data-h="${h}" data-s="${s}" data-l="${l}" aria-label="Цвет"></button>`;
  return`<div class="sh"><div><b>Свой цвет</b><small>Нажмите на цвет или подвиньте ползунки</small></div><button class="btn sm" data-act="pickBack">Отмена</button></div>
    <div class="cprev" id="cprev" style="background:${cur};height:52px"></div>
    <div class="row" style="margin-bottom:12px"><span class="lbl" style="margin:0;flex:none">Код цвета</span><input id="chex" data-in="hex" value="${cur}" maxlength="7" autocapitalize="off" autocorrect="off" spellcheck="false" style="text-transform:uppercase;font-variant-numeric:tabular-nums;letter-spacing:.04em" aria-label="Код цвета"></div>
    <div class="cgrid">${SHADES.map(([s,l])=>HUES.map(h=>cell(h,s,l)).join('')).join('')}${GRAYS.map(l=>cell(0,0,l)).join('')}</div>
    <label class="lbl">Оттенок</label><input type="range" class="cr hue" id="crh" min="0" max="359" data-in="pk" data-k="h" value="${p.h}">
    <label class="lbl">Насыщенность</label><input type="range" class="cr" id="crs" min="0" max="100" data-in="pk" data-k="s" value="${p.s}" style="background:${trackS(p)}">
    <label class="lbl">Яркость</label><input type="range" class="cr" id="crl" min="6" max="94" data-in="pk" data-k="l" value="${p.l}" style="background:${trackL(p)}">
    <button class="btn pri full" style="margin-top:6px" data-act="pickOk">Выбрать этот цвет</button>`;
};
function pickLive(skipHex){const p=ui.pick,c=pickHex(p);$('cprev').style.background=c;if(!skipHex)$('chex').value=c;$('crs').style.background=trackS(p);$('crl').style.background=trackL(p);
  document.querySelectorAll('.cgrid .on').forEach(b=>b.classList.remove('on'))}
IN.pk=el=>{const p=ui.pick;p[el.dataset.k]=+el.value;p.hex=null;pickLive()};
// Код цвета можно вписать руками: #RGB или #RRGGBB, решётка необязательна
IN.hex=el=>{let v=el.value.trim().replace(/^#?/,'#');if(/^#[0-9a-f]{3}$/i.test(v))v='#'+v.slice(1).replace(/./g,'$&$&');if(!/^#[0-9a-f]{6}$/i.test(v))return;
  v=v.toLowerCase();const p=ui.pick,[h,s,l]=hex2hsl(v);Object.assign(p,{h,s,l,hex:v});pickLive(true);$('crh').value=h;$('crs').value=s;$('crl').value=l};
ACT.pick=({ch,id,v})=>{const[h,s,l]=hex2hsl(v);ui.pick={ch,id,h,s,l,hex:/^#[0-9a-f]{6}$/i.test(v||'')?v.toLowerCase():null,back:ui.sheet?{name:ui.sheet.name,args:ui.sheet.args}:null};openSheet('color')};
ACT.pickSet=({h,s,l})=>{Object.assign(ui.pick,{h:+h,s:+s,l:+l,hex:null});renderSheet()};
ACT.pickBack=()=>{const b=ui.pick.back;ui.pick=null;if(b)openSheet(b.name,b.args);else closeSheet()};
ACT.pickOk=()=>{const p=ui.pick,c=pickHex(p);ui.pick=null;
  if(p.ch.indexOf('ic:')===0){IC[p.ch.slice(3)]=c;saveIcon();closeSheet();render();return}
  if(p.ch==='draft'){ui.draft.color=c;openSheet(p.back.name,p.back.args);return}
  if(p.ch==='place')PL(p.id).color=c;else S.cfg.settings[p.ch==='me'?'meColor':'accent']=c;
  save('config/main');closeSheet();render()};
// (старый системный выбор цвета больше не используется)
const CH={draft:el=>{ui.draft.color=el.value;renderSheet()},me:el=>ACT.meColor({v:el.value}),accent:el=>ACT.accent({v:el.value}),place:el=>ACT.plColorSet({id:el.dataset.id,v:el.value})};
document.addEventListener('change',e=>{const f=e.target.dataset&&CH[e.target.dataset.ch];if(f){rendered=false;f(e.target);if(!ui.sheet&&!rendered)render()}});
document.addEventListener('input',e=>{const el=e.target,f=el.dataset&&IN[el.dataset.in];if(f)f(el)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT')e.target.blur()});
view.addEventListener('scroll',()=>$('top').classList.toggle('sc',view.scrollTop>4),{passive:true});
// Телефон: не даём жесту прокрутки уходить на внешнюю страницу Google — иначе она сдвигается и снизу виден белый фон.
// Листать можно только середину экрана и открытое окно, и только пока им есть куда листаться
let tX=0,tY=0,tT=0,lastTap=0;
document.addEventListener('touchstart',e=>{tX=e.touches[0].clientX;tY=e.touches[0].clientY;tT=Date.now()},{passive:true});
// Кнопки срабатывают сразу по отпусканию пальца или стилуса, даже если он чуть сдвинулся:
// браузер в таких случаях сам «клик» не присылает
document.addEventListener('touchend',e=>{
  const c=e.changedTouches[0];
  // Смах влево-вправо по полоске с днями листает недели
  if(c&&!e.touches.length&&!ui.sheet&&ui.tab==='cal'&&e.target.closest('.week,.weeknav')){
    const dx=c.clientX-tX;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(c.clientY-tY)*1.5){ACT.week({n:dx<0?7:-7});lastTap=Date.now();return}
  }
  if(!c||e.touches.length||Date.now()-tT>900||Math.abs(c.clientX-tX)>14||Math.abs(c.clientY-tY)>14)return;
  if(tap(e.target)){lastTap=Date.now();if(e.cancelable)e.preventDefault()}
},{passive:false});
document.addEventListener('touchmove',e=>{
  if(!e.cancelable||e.touches.length>1||e.target.type==='range')return;
  const dy=e.touches[0].clientY-tY,dx=e.touches[0].clientX-tX,sc=e.target.closest('#sheet,#view');
  if(!sc||sc.scrollHeight<=sc.clientHeight||Math.abs(dx)>Math.abs(dy)){e.preventDefault();return}
  if((dy>0&&sc.scrollTop<=0)||(dy<0&&sc.scrollTop+sc.clientHeight>=sc.scrollHeight-1))e.preventDefault();
},{passive:false});
start();
</script>
